version: '3.8'
services:
  webapi_cleanarchitecture.apis:
    image: ${DOCKER_REGISTRY-}webapicleanarchitectureapis
    container_name: Api-CleanArchitecture
    build:
      context: .
      dockerfile: src/WebAPI_CleanArchitecture.APIs/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Database=Server=webapicleanarchitecture.sql;Database=ApiCleanArchitecture;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
    depends_on:
      - webapicleanarchitecture.sql
    networks:
      - app-network 
    ports:
      - 5001:8081
  webapicleanarchitecture.sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: Api-Sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong!Passw0rd
    ports:
      - "1439:1433"
    volumes:
      - mssql-data:/var/opt/mssql 
    networks:
      - app-network
  webapicleanarchitecture.serilog:
    image: datalust/seq:latest
    container_name: WebAPI-Serilog
    environment:
      - ACCEPT_EULA=Y
    ports:
      - 5341:5341
      - 9090:80    
    networks:
      - app-network
  webapicleanarchitecture.redis:
    image: redis:latest
    container_name: WebAPI-Redis
    restart: always
    ports:
      - 6379:6379
    networks:
      - app-network
volumes:
  mssql-data:
    
networks:
  app-network:
    driver: bridge